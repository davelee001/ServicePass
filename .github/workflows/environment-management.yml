name: Environment Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (dev, staging, production)'
        required: true
        default: 'dev'

jobs:
  backend-checks:
    uses: ./.github/workflows/automated-testing.yml

  contract-checks:
    uses: ./.github/workflows/smart-contract-compilation.yml

  manage-environment:
    needs: [backend-checks, contract-checks]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci --prefix backend

    - name: Deploy to selected environment
      env:
        DEPLOYMENT_KEY: ${{ secrets.DEPLOYMENT_KEY }}
      run: |
        if [ "${{ github.event.inputs.environment }}" == "dev" ]; then
          echo "Deploying to development..."
          # Add dev-specific deployment commands here
        elif [ "${{ github.event.inputs.environment }}" == "staging" ]; then
          echo "Deploying to staging..."
          # Add staging-specific deployment commands here
        elif [ "${{ github.event.inputs.environment }}" == "production" ]; then
          echo "Deploying to production..."
          # Add production-specific deployment commands here
        else
          echo "Unknown environment: ${{ github.event.inputs.environment }}"
          exit 1
        fi