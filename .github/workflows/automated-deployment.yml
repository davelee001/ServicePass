name: Automated Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    needs: [backend-checks, contract-checks]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix frontend

    - name: Build project
      run: npm run build

    - name: Deploy to production
      env:
        DEPLOYMENT_KEY: ${{ secrets.DEPLOYMENT_KEY }}
      run: |
        scp -r ./frontend/dist/. user@production-server:/var/www/project
        ssh user@production-server 'sudo systemctl restart project-service'