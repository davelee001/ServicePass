name: Smart Contract Compilation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    name: Move build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUIUP_INSTALL_DIR: ${{ runner.temp }}/sui-bin
          SUIUP_DEFAULT_BIN_DIR: ${{ runner.temp }}/sui-bin
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh -o "$RUNNER_TEMP/install-suiup.sh"
          sh "$RUNNER_TEMP/install-suiup.sh"
          "$SUIUP_INSTALL_DIR/suiup" install sui@mainnet -y
          echo "$SUIUP_DEFAULT_BIN_DIR" >> "$GITHUB_PATH"
      - name: Assemble Move package
        run: |
          mkdir -p "$RUNNER_TEMP/servicepass-move"
          cp Move.toml "$RUNNER_TEMP/servicepass-move/Move.toml"
          cp Move.lock "$RUNNER_TEMP/servicepass-move/Move.lock"
          cp -R move/sources "$RUNNER_TEMP/servicepass-move/sources"
      - name: Build smart contracts
        run: sui move build --build-env testnet --path "$RUNNER_TEMP/servicepass-move"
      - name: Test smart contracts
        run: sui move test --build-env testnet --path "$RUNNER_TEMP/servicepass-move"
