# Standalone production definition: do not merge with docker-compose.yml.
# Secret-manager agents must materialize these files outside the repository.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact HTTPS frontend origin}
      SUI_NETWORK: ${SUI_NETWORK:?Set SUI_NETWORK}
      PACKAGE_ID: ${PACKAGE_ID:?Set PACKAGE_ID}
      VOUCHER_PACKAGE_ID: ${PACKAGE_ID:?Set PACKAGE_ID}
      ADMIN_CAP_ID: ${ADMIN_CAP_ID:?Set ADMIN_CAP_ID}
      REGISTRY_ID: ${REGISTRY_ID:?Set REGISTRY_ID}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      QR_SIGNING_SECRET_FILE: /run/secrets/qr_signing_secret
      ADMIN_PRIVATE_KEY_FILE: /run/secrets/admin_private_key
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      REDIS_URL_FILE: /run/secrets/redis_url
    secrets:
      - jwt_secret
      - encryption_key
      - qr_signing_secret
      - admin_private_key
      - mongodb_uri
      - redis_url
    networks: [servicepass-network]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    restart: unless-stopped
    # Terminate HTTPS at the host ingress; the public API shares this origin.
    ports: ["127.0.0.1:3001:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [servicepass-network]
secrets:
  jwt_secret:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/jwt_secret
  encryption_key:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/encryption_key
  qr_signing_secret:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/qr_signing_secret
  admin_private_key:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/admin_private_key
  mongodb_uri:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/mongodb_uri
  redis_url:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/redis_url
networks:
  servicepass-network:
