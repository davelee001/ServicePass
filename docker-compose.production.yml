      - encryption_key
      - qr_signing_secret
      - admin_private_key
      - mongodb_uri
      - redis_url
    networks: [servicepass-network]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    restart: unless-stopped
    # Terminate HTTPS at the host ingress; the public API shares this origin.
    ports: ["127.0.0.1:3001:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [servicepass-network]
secrets:
  jwt_secret:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/jwt_secret
  encryption_key:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/encryption_key
  qr_signing_secret:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/qr_signing_secret
  admin_private_key:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/admin_private_key
  mongodb_uri:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/mongodb_uri
  redis_url:
    file: ${SECRETS_DIR:?Set the secret-manager output directory}/redis_url
networks:
  servicepass-network:
